# ============================================================
#  超市收银管理系统 · 容器编排
#
#  用法（两种形态共用这一份文件）：
#
#   ① 日常开发（只起中间件，应用在 IDE / vite 里跑）
#        docker compose up -d
#
#   ② 答辩演示 / 验收（全栈，含后端与前端网关）
#        docker compose --profile full up -d --build
#
#   查看状态：docker compose ps
#   看日志  ：docker compose logs -f backend
#   全停    ：docker compose down
#   连数据一起清：docker compose down -v
# ============================================================

name: supermarket-pos

services:

  # ---------------- MySQL 8.0 ----------------
  mysql:
    image: mysql:8.0.36
    container_name: pos-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pos}
      MYSQL_USER: ${MYSQL_USER:-pos}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_0900_ai_ci"
      - "--default-time-zone=+08:00"
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/conf.d:/etc/mysql/conf.d:ro
      - ./docker/mysql/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    networks:
      - pos-net

  # ---------------- Redis 7.2 ----------------
  redis:
    image: redis:7.2-alpine
    container_name: pos-redis
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    command:
      - "redis-server"
      - "/usr/local/etc/redis/redis.conf"
      - "--requirepass"
      - "${REDIS_PASSWORD:-}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    networks:
      - pos-net

  # ---------------- Adminer（数据库网页客户端） ----------------
  # 演示时可以不看它；开发时很方便，浏览器里直接查表
  adminer:
    image: adminer:4.8.1
    container_name: pos-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - pos-net

  # ---------------- 后端（仅 full 形态启动） ----------------
  backend:
    profiles: ["full"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: pos/backend:local
    container_name: pos-backend
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-pos}
      DB_USER: ${MYSQL_USER:-pos}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=70 -Duser.timezone=Asia/Shanghai"
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 70s
    networks:
      - pos-net

  # ---------------- 前端网关（仅 full 形态启动） ----------------
  # 现在只托管一张状态页；三个前端构建出来后挂到这里即可
  gateway:
    profiles: ["full"]
    image: nginx:1.27-alpine
    container_name: pos-gateway
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${GATEWAY_PORT:-8088}:80"
    volumes:
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/html:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz | grep -q ok"]
      interval: 15s
      timeout: 3s
      retries: 5
    networks:
      - pos-net

volumes:
  mysql-data:
    name: pos-mysql-data
  redis-data:
    name: pos-redis-data

networks:
  pos-net:
    name: pos-net
    driver: bridge
