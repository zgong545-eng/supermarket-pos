# ============================================================
#  前端网关 · 唯一对外入口
#
#  现在：托管一张状态页 + 把 /api 反代到后端
#  之后：三个前端构建产物挂进来（/ 管理端、/pos 收银端、/h5 会员端）
#
#  为什么要网关而不是直接暴露后端端口：
#    同源，前端不用配 CORS；换后端端口只改这一处；答辩时只报一个地址
# ============================================================

server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 20m;

    # ---------- 容器健康检查用（不写日志，避免刷屏） ----------
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---------- 后端接口 ----------
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 改代码后重建容器，网关不用重启也能恢复
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # ---------- 后端健康检查透传（调试用） ----------
    location = /actuator/health {
        proxy_pass       http://backend:8080/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---------- 静态资源 ----------
    # 先禁缓存跑通逻辑，等前端上线再按 hash 文件名开长缓存
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    # ---------- SPA 兜底 ----------
    # 刷新 /goods/123 这类前端路由时不能 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 留位：三个前端上线后启用 ----------
    # location /pos/ { alias /usr/share/nginx/pos/;  try_files $uri $uri/ /pos/index.html; }
    # location /h5/  { alias /usr/share/nginx/h5/;   try_files $uri $uri/ /h5/index.html;  }

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;
}
