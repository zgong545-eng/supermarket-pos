# ============================================================
#  Redis 7.2 配置
#  密码不写在这里 —— 由 compose 通过 --requirepass 传入，
#  避免密码跟着代码进仓库
# ============================================================

# ---------- 网络 ----------
# 只监听容器内网卡，不对外暴露；外部访问靠 compose 的 ports 映射
bind 0.0.0.0
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ---------- 持久化 ----------
# AOF 打开：库存预占的键（lock/commit）和支付幂等键丢了会导致重复扣款或库存卡死
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB 保留一份快照做兜底
save 900 1
save 300 10
save 60 10000

dir /data
dbfilename dump.rdb

# ---------- 内存 ----------
# 这个库里只放缓存和短期键，不存唯一事实来源，所以内存满了淘汰最久未用的
maxmemory 256mb
maxmemory-policy allkeys-lru

# ---------- 日志 ----------
loglevel notice
# 演示时要看命令流就用下面的，平时关掉（会刷屏）
# loglevel verbose

# ---------- 慢日志 ----------
slowlog-log-slower-than 10000
slowlog-max-len 128

# ---------- 危险命令 ----------
# 生产环境必须禁；课堂演示保留 FLUSHDB 方便重置数据，
# 真上线时把下面两行注释去掉
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
