server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 20

spring:
  application:
    name: supermarket-pos

  # ---------- 数据源 ----------
  # 所有地址都走环境变量，默认值是"本机开发"场景。
  # 容器里由 docker-compose 覆盖成 mysql / redis（服务名即主机名）。
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pos}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:pos}
    password: ${DB_PASSWORD:pos_Local_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: pos-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      # 3 秒拿不到连接就报错，不要让自检接口挂在那里转圈
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ---------- 序列化 ----------
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null

  lifecycle:
    timeout-per-shutdown-phase: 20s

# ---------- 健康检查 ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: true

# ---------- 日志 ----------
logging:
  level:
    root: INFO
    com.supermarket.pos: DEBUG
    # MyBatis 接入后打开下面这行可以看完整 SQL
    # com.supermarket.pos.module: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

---
# ============================================================
#  docker profile：容器内运行时启用
#  与本地开发的区别只有日志和 actuator 细节，连接地址由环境变量给
# ============================================================
spring:
  config:
    activate:
      on-profile: docker

logging:
  level:
    com.supermarket.pos: INFO
