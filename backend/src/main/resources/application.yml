server:
  port: 8080
  shutdown: graceful
  tomcat:
    threads:
      max: 200
      min-spare: 20

spring:
  application:
    name: supermarket-pos

  # ---------- 数据源 ----------
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:pos}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${DB_USER:pos}
    password: ${DB_PASSWORD:pos_Local_2026}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: pos-hikari
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000

  # ---------- 数据库版本管理 ----------
  # 表结构只有 Flyway 能改，不允许手工改库。
  # 每加一版就是 db/migration/V3__xxx.sql，谁改的、改了什么一目了然。
  flyway:
    enabled: true
    locations: classpath:db/migration
    # 必须是 false：true 会在非空库上打一个 baseline，
    # 结果 V1 建表脚本被当成"已执行"跳过，库是空的但版本号是 1，非常难查
    baseline-on-migrate: false
    validate-on-migrate: true
    out-of-order: false
    table: flyway_schema_history

  # ---------- Redis ----------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ---------- 序列化 ----------
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

  lifecycle:
    timeout-per-shutdown-phase: 20s

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

# ---------- MyBatis-Plus ----------
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    # 想看 SQL 就把下面这行换成 StdOutImpl
    # log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  mapper-locations: classpath*:mapper/**/*.xml

# ---------- 业务配置 ----------
pos:
  jwt:
    # 生产环境务必换成环境变量注入，长度至少 32 字节
    secret: ${JWT_SECRET:pos-supermarket-course-project-secret-key-2026-change-me}
    expire-minutes: 720
    header: Authorization
    prefix: "Bearer "
  store:
    default-id: 1
  # 课堂演示专用开关：开启后可访问 /api/demo/** 灌数据与重置
  demo:
    enabled: ${DEMO_ENABLED:true}

# ---------- 健康检查 ----------
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    redis:
      enabled: true
    db:
      enabled: true

# ---------- 日志 ----------
logging:
  level:
    root: INFO
    com.supermarket.pos: DEBUG
    org.springframework.security: WARN
    com.baomidou: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

---
# ============================================================
#  docker profile
# ============================================================
spring:
  config:
    activate:
      on-profile: docker

logging:
  level:
    com.supermarket.pos: INFO
