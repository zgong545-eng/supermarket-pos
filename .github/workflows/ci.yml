name: CI

# 触发条件：推 main、以及对 main 发起 PR。其余分支（feature/*）推上去不跑，
# 省得六个人一天几十次 push 把 Actions 队列刷满；真正要验的是"能不能合进 main"。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同一分支连续推送时取消上一次未完成的运行（比如连改三个 commit 只跑最后一次）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------------------------------------------------
  # 1. 后端：能不能编译过
  #    只做 compile 不做 test —— 当前仓库还没有测试代码，
  #    等 M03 库存、M06 订单的单元测试补上后，把 goal 改成 verify。
  # ------------------------------------------------------------------
  backend:
    name: 后端编译
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: mvn compile
        working-directory: backend
        # -ntp 关掉下载进度条，日志里只剩真正的报错，出问题好看
        run: mvn -B -ntp -DskipTests compile

  # ------------------------------------------------------------------
  # 2. 前端：能不能构建出 dist
  #    用 npm ci 而不是 npm install —— ci 严格按 package-lock.json 装，
  #    不会因为某天上游发了个新小版本就"别人机器能跑我的跑不了"。
  # ------------------------------------------------------------------
  frontend:
    name: 前端构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: npm run build
        working-directory: frontend
        run: npm run build

      - name: 校验产物存在
        working-directory: frontend
        # vite build 成功但产物为空也算失败，这一步防这种静默错误
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html 不存在"; exit 1; }
          du -sh dist

  # ------------------------------------------------------------------
  # 3. 仓库卫生：把 docs/03 里的"五条禁令"变成机器能拦的规则
  #    人说"我记得别提交 .env"是靠不住的，CI 说才算数。
  # ------------------------------------------------------------------
  guard:
    name: 仓库卫生检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 禁止提交 .env（明文口令）
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "::error::.env 被提交进仓库了。它含数据库口令，必须从版本库移除并轮换口令。"
            exit 1
          fi

      - name: 禁止提交构建产物
        run: |
          hit=$(git ls-files | grep -E '(^|/)(node_modules|target|dist)/' || true)
          if [ -n "$hit" ]; then
            echo "::error::发现构建产物入库，请从 .gitignore 覆盖它们："
            echo "$hit"
            exit 1
          fi

      - name: 禁止提交私钥
        run: |
          hit=$(git ls-files | grep -E '(^|/)(id_rsa|id_ed25519|\.pem|\.p12|\.jks)$' || true)
          if [ -n "$hit" ]; then
            echo "::error::发现疑似私钥文件入库："
            echo "$hit"
            exit 1
          fi

  # ------------------------------------------------------------------
  # 4. 编排文件校验
  #    docker-compose.yml 里一个缩进错了，六个人全都起不来，
  #    而这类错在本地只表现为"某个容器一直重启"，很难看出来。
  # ------------------------------------------------------------------
  compose:
    name: 编排文件校验
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 .env
        run: cp .env.example .env

      - name: docker compose config（含 full profile）
        run: docker compose --profile full config -q

      - name: 所有服务都必须有 healthcheck 或 restart 策略
        run: |
          docker compose --profile full config --format json > /tmp/c.json
          python3 - <<'PY'
          import json
          cfg = json.load(open('/tmp/c.json'))
          bad = [n for n, s in cfg.get('services', {}).items()
                 if not s.get('healthcheck') and not s.get('restart')]
          if bad:
              print(f"::error::以下服务既无 healthcheck 也无 restart 策略: {bad}")
              raise SystemExit(1)
          print("ok")
          PY
